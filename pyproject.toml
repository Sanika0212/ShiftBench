[project]
name = "shiftbench"
version = "0.1.0"
description = "Does a hallucination detector's calibrated threshold survive a change of domain, and what does it cost to get the guarantee back"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sanika Najan", email = "sanikanajan@gmail.com" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2,<3",
  "pyarrow>=17",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "datasets>=3.0",
  "huggingface-hub>=0.25",
  "onnxruntime>=1.19",
  "transformers>=4.45",
  "tokenizers>=0.20",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
# The leaderboard: a FastAPI site over the results tables.
site = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "duckdb>=1.1"]
# A local instruction model as one more detector, served by Ollama over HTTP.
judge = ["httpx>=0.27"]
cloud = ["google-cloud-bigquery>=3.25", "db-dtypes>=1.3"]

[project.scripts]
shiftbench = "shiftbench.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.3", "pytest-cov>=5.0", "pandas-stubs"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shiftbench"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/shiftbench"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "models: runs the ONNX detectors, which need the exported models (slow)",
]
addopts = "-m 'not models'"
